[project]
name = "scpagwas"
version = "0.1.0"
description = "Python reimplementation of the scPagwas single-cell pathway GWAS pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "anndata",
  "statsmodels",
  "matplotlib",
  "seaborn",
  "pyarrow",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scpagwas"]
